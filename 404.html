<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Yoga with VKB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
:root{color-scheme:light;--paper:#FFFFFF;--cream:#FBF4EC;--night:#2B1A0F;--ink:#2B1A0F;--ink-2:#5E4A3C;--ink-3:#755F50;--line-2:#D9C5AB;--sun-1:#E8611A;--sun-grad:radial-gradient(130% 160% at 20% 0%,#FFE08A 0%,#FDBA3F 32%,#F4901D 68%,#EC7020 100%);--sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*,::before,::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--cream)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;padding:16px max(24px,env(safe-area-inset-left)) 0}
.brand{display:inline-flex;align-items:center;min-height:44px;border-radius:8px}
.brand img{display:block;height:38px;width:auto}
main{flex:1;display:grid;place-items:center;padding:32px max(24px,env(safe-area-inset-left)) 64px}
.box{max-width:520px;text-align:center}
.mark{width:132px;height:132px;margin:0 auto 28px}
.code{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sun-1)}
h1{margin:0 0 14px;font-size:clamp(32px,6vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
p{margin:0 auto 32px;max-width:420px;color:var(--ink-2);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:6px 26px;border:0;border-radius:999px;font:600 16px/1.1 var(--sans);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease-out,box-shadow .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-sun{background:var(--sun-grad);color:var(--night);box-shadow:0 14px 28px -16px rgba(232,97,26,.85)}
.btn-light{background:#fff;color:var(--night);box-shadow:inset 0 0 0 1px var(--line-2)}
@media (hover:hover){.btn-sun:hover{box-shadow:0 18px 32px -14px rgba(232,97,26,.9)}.btn-light:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.help{margin:28px 0 0;font-size:15px;color:var(--ink-3)}
.help a{color:var(--ink);font-weight:600;text-underline-offset:3px}
@media (max-width:420px){.actions .btn{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Yoga with VKB home"><img src="/assets/logo.svg" alt="Yoga with VKB" width="134" height="38"></a>
</header>
<main>
  <div class="box">
    <img class="mark" src="/assets/apple-touch-icon.png" alt="" width="132" height="132">
    <p class="code">Error 404</p>
    <h1>This page took a deep breath and drifted away</h1>
    <p>The link may be old or mistyped. Go back to the home page, or refresh to try again.</p>
    <div class="actions">
      <a class="btn btn-sun" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        Back to home
      </a>
      <button class="btn btn-light" type="button" onclick="location.reload()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>
        Refresh page
      </button>
    </div>
    <p class="help">Want to book a class? <a href="https://wa.me/919815207270">Chat on WhatsApp</a></p>
  </div>
</main>
</body>
</html>
